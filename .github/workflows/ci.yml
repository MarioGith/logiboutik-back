name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:3.6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
        env:
          MONGO_URL_TEST: mongodb://localhost:27017/logiboutik-test
      - run: pnpm build

  # Builds the image on every run, but only publishes it (as :latest) from
  # main: pull requests and dev must never replace the production image.
  docker:
    needs: check
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USER || 'local' }}/logiboutik-back:latest
            ${{ secrets.DOCKER_USER || 'local' }}/logiboutik-back:${{ github.sha }}
